name: Refresh proxy catalog and sync season

on:
  schedule:
    - cron: "17 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pages-migration source
        uses: actions/checkout@v4
        with:
          ref: pages-migration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and check public proxies
        run: python scripts/proxy_collector.py
      - name: Commit generated catalog and season
        run: |
          if git diff --quiet -- public/proxies.json public/proxies.txt public/season.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/proxies.json public/proxies.txt public/season.json
          git commit -m "chore: refresh proxy catalog and season"
          git push origin HEAD:pages-migration
