name: Refresh proxy catalog and sync season

on:
  schedule:
    - cron: "17 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proxy-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout pages-migration
        uses: actions/checkout@v4
        with:
          ref: pages-migration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect proxies and mirror Worker season
        run: python scripts/proxy_collector.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/proxies.json public/proxies.txt public/season.json
          if git diff --cached --quiet; then
            echo "Generated files are unchanged."
          else
            git commit -m "chore: refresh proxy catalog and season"
            git push origin HEAD:pages-migration
          fi
      - name: Preserve custom domain
        run: |
          if [ -f CNAME ]; then cp CNAME public/CNAME; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
